<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELO | Jasa Pembuatan Website Profesional</title>
    <meta
      name="description"
      content="Jasa Pembuatan Website Profesional untuk UMKM & Personal Brand."
    />
    <meta name="theme-color" content="#2563eb" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://velojasweb.my.id/assets/img/logo.png"
    />

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
            colors: {
              brand: "#2563eb",
              darkbg: "#0f172a",
              darkcard: "#1e293b",
            },
          },
        },
      };
    </script>

    <script>
      (function () {
        try {
          const saved = localStorage.getItem("velo-theme");
          if (
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body
    class="bg-[#f3f4f6] text-gray-900 dark:bg-darkbg dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col items-center py-10 px-4 transition-colors duration-300"
  >
    <!-- Tombol Toggle Theme -->
    <button
      id="themeToggle"
      type="button"
      aria-label="Ganti tema"

    >
      <svg
        class="w-4 h-4 hidden dark:block text-yellow-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"

        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
      <svg
        class="w-4 h-4 block dark:hidden text-gray-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"
        />
      </svg>
    </button>

      <!-- Logo & Profile -->

          src="https://velojasweb.my.id/assets/img/logo.png"

        <!-- Link 2: Website Utama -->

            />
          </svg>
          <span class="ml-4 font-medium text-sm flex-grow text-left"

            class="w-4 h-4 text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-200 transition"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </a>

        <!-- Link 4: Instagram -->
        <a
          href="https://www.instagram.com/velojasweb/"
          target="_blank"
          class="flex items-center w-full p-4 bg-white dark:bg-darkcard rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200 group"
        >
          <svg
            class="w-5 h-5 text-pink-500"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"

            fill="none"

            stroke="currentColor"

          >

              stroke-linejoin="round"
              d="M9 5l7 7-7 7"

      <!-- Footer -->
      <div class="mt-12 text-center">
        <p class="text-[11px] font-medium text-gray-400 dark:text-gray-500">
          &copy; <span id="year"></span> VELO.
        </p>
      </div>
    </main>

    <script>
      const themeToggle = document.getElementById("themeToggle");
      const html = document.documentElement;
      themeToggle.addEventListener("click", () => {
        html.classList.toggle("dark");
        localStorage.setItem(
          "velo-theme",
          html.classList.contains("dark") ? "dark" : "light",
        );
      });
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
